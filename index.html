<html lang="en">
<head>
<meta charset="utf-8">

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* TRIdata — brand: navy #16202C, swim blue, bike teal, run orange.
   Series hues are the brand hues stepped per theme so they clear the
   contrast and colour-vision-deficiency floors on each surface. */
:root{
  color-scheme: light;
  --ground:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F9FB; --sunken:#E7EBF0;
  --ink:#16202C; --ink-2:#3D4A5A; --muted:#67748633; --muted:#677486; --faint:#95A1B0;
  --line:#DBE1E9; --line-soft:#EBEFF4;
  --brand:#1F6FD0; --brand-ink:#17509B; --brand-wash:#E6EFFB;
  --swim:#1F6FD0; --bike:#0E9C8C; --run:#D9480F;
  --swim-wash:#E6EFFB; --bike-wash:#E0F5F2; --run-wash:#FCEBE2;
  --gold:#96701C; --gold-wash:#F7F0DD;
  --good:#0E9C8C; --warn:#96701C; --crit:#D9480F;
  --t1:#CFDEF3; --t2:#9FC0E8; --t3:#5B93D9; --t4:#2166C6; --t5:#0F3D80;
  --shadow:0 1px 2px rgba(22,32,44,.05), 0 8px 24px -14px rgba(22,32,44,.22);
  --r:10px;
  --display:"Barlow Condensed", "Arial Narrow", Helvetica, sans-serif;
  --body:"Barlow", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0D141C; --surface:#16202C; --surface-2:#1C2836; --sunken:#0A1017;
    --ink:#EAF0F7; --ink-2:#BCC8D6; --muted:#8B99AA; --faint:#65727F;
    --line:#27343F; --line-soft:#1D2833;
    --brand:#3D93F0; --brand-ink:#7FB6F5; --brand-wash:#12263C;
    --swim:#3D93F0; --bike:#12A896; --run:#E85B24;
    --swim-wash:#12263C; --bike-wash:#0B2A28; --run-wash:#2E1810;
    --gold:#D8B25A; --gold-wash:#2A2314;
    --good:#12A896; --warn:#D8B25A; --crit:#E85B24;
    --t1:#1B2C3F; --t2:#204464; --t3:#2C6CA8; --t4:#3D93F0; --t5:#8CBFF7;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -16px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0D141C; --surface:#16202C; --surface-2:#1C2836; --sunken:#0A1017;
  --ink:#EAF0F7; --ink-2:#BCC8D6; --muted:#8B99AA; --faint:#65727F;
  --line:#27343F; --line-soft:#1D2833;
  --brand:#3D93F0; --brand-ink:#7FB6F5; --brand-wash:#12263C;
  --swim:#3D93F0; --bike:#12A896; --run:#E85B24;
  --swim-wash:#12263C; --bike-wash:#0B2A28; --run-wash:#2E1810;
  --gold:#D8B25A; --gold-wash:#2A2314;
  --good:#12A896; --warn:#D8B25A; --crit:#E85B24;
  --t1:#1B2C3F; --t2:#204464; --t3:#2C6CA8; --t4:#3D93F0; --t5:#8CBFF7;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -16px rgba(0,0,0,.85);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:600;letter-spacing:.01em;text-wrap:balance;line-height:1.12}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;max-width:1500px;margin:0 auto}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:22px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brandmark{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.brandmark img{width:38px;height:38px;border-radius:9px;display:block;flex:none;box-shadow:var(--shadow)}
.wordmark{font-family:var(--body);font-size:27px;font-weight:700;letter-spacing:-.022em;line-height:1}
.wordmark .w1{color:var(--swim)} .wordmark .w2{color:var(--bike)} .wordmark .w3{color:var(--run)}
.wordmark .w4{color:var(--ink)}
.tagline{font-family:var(--mono);font-size:8.6px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.rail-sub{font-size:12.5px;color:var(--muted);margin:0 0 18px}

.idx{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:20px}
.idx-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.idx-num{font-family:var(--display);font-size:52px;font-weight:700;line-height:.9;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.idx-num small{font-size:19px;color:var(--muted);font-weight:500}
.tierbadge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sunken);color:var(--ink-2);border:1px solid var(--line)}
.tierdot{width:8px;height:8px;border-radius:50%;flex:none}

nav{display:flex;flex-direction:column;gap:2px}
.navgroup{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px;padding-left:10px}
.tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-size:14.5px;font-weight:500}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--brand-wash);color:var(--brand-ink);font-weight:600}
.tab .tnum{font-family:var(--mono);font-size:10.5px;color:var(--faint);width:14px;flex:none}
.tab[aria-selected="true"] .tnum{color:var(--brand-ink)}

main{padding:26px 30px 70px;min-width:0}
.page-head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:6px}
.page-head h2{font-size:30px;letter-spacing:.005em}
.page-sub{color:var(--muted);font-size:14px;max-width:66ch;margin:2px 0 22px}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{border-radius:var(--r);box-shadow:none}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h3{font-size:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.card-h .hint{font-size:12.5px;color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.hr{height:1px;background:var(--line-soft);border:0;margin:16px 0}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:7px;cursor:pointer;font-size:13.5px;font-weight:500}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--crit);background:var(--run-wash)}

label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
label.f .sub{font-weight:400;color:var(--faint);font-size:11px;letter-spacing:0}
input[type=text],input[type=number],input[type=date],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:14px;width:100%;font-family:var(--mono);font-variant-numeric:tabular-nums}
input:hover,select:hover{border-color:var(--muted)}
select,textarea{font-family:var(--body)}
.echo{font-family:var(--mono);font-size:11px;color:var(--brand-ink);min-height:14px;letter-spacing:.02em}
.echo.bad{color:var(--crit)}
.formgrid{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}

table{width:100%;border-collapse:collapse;font-size:13.5px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tick{display:inline-block;padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid transparent}

/* ---------- gate ladder ---------- */
.gl{display:grid;grid-template-columns:176px minmax(90px,1fr) 112px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.gl:last-child{border-bottom:0}
.gl-name{font-size:13.5px;font-weight:500;line-height:1.2}
.gl-name .u{display:block;font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.05em}
.gl-val{text-align:right;font-family:var(--mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.gl-val .sc{display:block;font-size:10px;color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.lad{position:relative;height:26px}
.lad::before{content:"";position:absolute;left:0;right:0;top:10px;height:6px;border-radius:3px;background:var(--sunken)}
.lad i{position:absolute;display:block}
.lad .seg{top:10px;height:6px}
.lad .gate{top:5px;height:16px;width:1.5px;margin-left:-0.75px;border-radius:1px}
.lad .ref{top:1px;height:14px;width:0;margin-left:-1px;border-left:1.5px dashed var(--gold)}
.lad .ref::after{content:"";position:absolute;top:0;left:0;border-left:5px solid var(--gold);border-top:3px solid transparent;border-bottom:3px solid transparent}
.lad .mark{top:7px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px rgba(0,0,0,.06)}

.glkey{margin:2px 0 6px}
.glkey-t{position:relative;height:15px;margin-left:188px;margin-right:124px}
.glkey-t span{position:absolute;top:0;transform:translateX(-50%);font-family:var(--mono);font-size:8.6px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.glkey-t span:first-child{transform:none}
.glkey-t span:last-child{transform:translateX(-72%)}
.glkey-n{font-size:11.5px;color:var(--muted);margin-top:2px}
@media (max-width:900px){ .glkey-t{margin-left:0;margin-right:0} }

/* ---------- meters ---------- */
.pillar{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.pillar:last-child{border-bottom:0}
.pillar-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pillar-name{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.pillar-w{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.06em}
.pillar-sc{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.track{position:relative;height:9px;background:var(--sunken);border-radius:5px;overflow:hidden}
.track > i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;display:block}
.track > b{position:absolute;top:0;bottom:0;width:1px;background:var(--surface);opacity:.85}

.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--gold-wash);border:1px solid var(--gold);border-radius:var(--r);padding:10px 14px;margin-bottom:18px;font-size:13.5px}
.banner strong{font-weight:600}
.note{background:var(--surface-2);border-left:3px solid var(--brand);border-radius:0 8px 8px 0;padding:11px 14px;font-size:13px;color:var(--ink-2)}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:var(--r)}

.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}

.chartbox{position:relative}
.chartbox svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:7px;padding:7px 10px;font-size:12px;opacity:0;transition:opacity .1s;z-index:20;white-space:nowrap}
.tip .tv{font-family:var(--mono);font-weight:600}

.discpill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.discpill i{width:9px;height:9px;border-radius:2px;display:block}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .k{font-family:var(--display);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.kpi .k small{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:.03em}
.kpi .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:5px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.18s;pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .navgroup{display:none}
  .tab{white-space:nowrap;padding:7px 11px}
  .tab .tnum{display:none}
  .idx{display:flex;align-items:center;gap:14px}
  .idx-num{font-size:38px;margin:0}
  main{padding:20px 16px 60px}
  .gl{grid-template-columns:1fr;gap:4px}
  .gl-val{text-align:left}
}
</style>

<div class="shell">
  <aside class="rail">
    <div class="brandmark">
      <img id="brandIcon" alt="" width="38" height="38">
      <div>
        <div class="wordmark"><span class="w1">T</span><span class="w2">R</span><span class="w3">I</span><span class="w4">data</span></div>

    <nav id="nav" role="tablist" aria-label="Sections"></nav>

      <button class="btn sm" id="btnExport" type="button">Export</button>

    <p class="mono" id="storeState" style="font-size:10px;color:var(--faint);margin-top:12px;letter-spacing:.04em"></p>
  </aside>

  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================================
   TRIATHLON ELITE INDEX
   All durations are stored as DECIMAL MINUTES (e.g. 62.5 === 1:02:30).
   ========================================================================== */

/* ---------- 1. TIME UTILITIES (decimal minutes are the native unit) ------- */

// Accepts: "62.5" | "62,5" | "1:02:30" | "62:30" | "1h02m30" -> decimal minutes
function parseMin(raw){
  if(raw===null||raw===undefined) return null;
  let s=String(raw).trim().toLowerCase();
  if(!s) return null;
  s=s.replace(/,/g,'.').replace(/\s+/g,'');
  s=s.replace(/h/g,':').replace(/m(?!s)/g,':').replace(/s$/,'');
  s=s.replace(/:+$/,'');
  if(s.includes(':')){
    const p=s.split(':').map(x=>x===''?0:parseFloat(x));
    if(p.some(n=>isNaN(n))) return null;
    if(p.length===2) return p[0]+p[1]/60;
    if(p.length===3) return p[0]*60+p[1]+p[2]/60;
    return null;
  }
  const n=parseFloat(s);
  return isNaN(n)?null:n;
}
// decimal minutes -> "m:ss" (or "h:mm:ss" past an hour)
function fmtMin(m,force){
  if(m===null||m===undefined||isNaN(m)) return '—';
  const neg=m<0; m=Math.abs(m);
  const total=Math.round(m*60);
  const h=Math.floor(total/3600), mm=Math.floor((total%3600)/60), ss=total%60;
  const p=n=>String(n).padStart(2,'0');
  const out=(h>0||force==='h')?`${h}:${p(mm)}:${p(ss)}`:`${mm}:${p(ss)}`;
  return (neg?'−':'')+out;
}
function fmtDec(m,d){ return (m===null||m===undefined||isNaN(m))?'—':m.toFixed(d===undefined?2:d); }
const round=(n,d)=>Math.round(n*Math.pow(10,d))/Math.pow(10,d);

/* ---------- 2. BENCHMARK STANDARDS ---------------------------------------
   Five gates. Each ladder is [Developing, Age-Group, Competitive, National,
   Elite] and maps to scores [20, 40, 60, 80, 100].
   Race ladders are calibrated against real reference performances (see the
   Standards tab for provenance). Male senior values; female values are
   derived with the documented sex factors.
------------------------------------------------------------------------- */

const TIERS=[
  {n:'Developing', ab:'DEV', k:'t1', s:20, d:'Completing the distance; building the aerobic base.'},
  {n:'Age-Group',  ab:'AG',  k:'t2', s:40, d:'Mid-pack age-grouper, training consistently.'},
  {n:'Competitive',ab:'COMP',k:'t3', s:60, d:'Top 10–20% of the field; age-group podium contender.'},
  {n:'National',   ab:'NAT', k:'t4', s:80, d:'World-championship qualifier / national squad level.'},
  {n:'Elite',      ab:'ELITE',k:'t5', s:100,d:'Professional / world-championship start list.'}
];

// lower-is-better ladders are DESCENDING; higher-is-better are ASCENDING
const RACE={
  sprint:{
    name:'Sprint', legs:'750 m · 20 km · 5 km',
    note:'Age-group ladders assume a non-drafting bike leg. The Elite gate reflects draft-legal racing, where the bike split is 8–12% faster than a solo effort.',
    total:[105,82,70,60,52],
    swim:[21,15,12.5,10.5,9.0], swimM:750,
    bike:[45,36,31,29,27],      bikeKm:20,
    run:[32,24,19.5,16.5,14.5], runKm:5,
    t1:[4,2.5,1.6,1.0,0.6], t2:[3,2,1.3,0.8,0.5],
    ref:{label:'World-class benchmark', total:50, txt:'≈50:00 — World Triathlon Cup / supertri sprint winning times.'}
  },
  olympic:{
    name:'Olympic / Standard', legs:'1.5 km · 40 km · 10 km',
    note:'Elite gate = draft-legal WTCS racing. A strong non-drafting Olympic is typically 6–9 min slower for the same engine.',
    total:[195,150,130,115,103],
    swim:[42,30,24,20,17.8], swimM:1500,

// Map a value onto a 5-gate ladder -> 0..100.
function scoreLadder(v, lad, dir){
  if(v===null||v===undefined||isNaN(v)) return null;
  const pts=lad.map((x,i)=>({x, s:(i+1)*20}));
  const asc = dir===1;
  // Below the first gate
  if((asc && v<=pts[0].x) || (!asc && v>=pts[0].x)){
    const span=Math.abs(pts[1].x-pts[0].x)||1;
    const off=(asc?(pts[0].x-v):(v-pts[0].x))/span*20;
    return Math.max(0, 20-off);
  }
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1];
    const inSeg = asc ? (v>=a.x && v<=b.x) : (v<=a.x && v>=b.x);
    if(inSeg){
      const f=(b.x-a.x)===0?0:(v-a.x)/(b.x-a.x);
      return a.s + f*(b.s-a.s);
    }
  }
  // Beyond the Elite gate
  const last=pts[pts.length-1], prev=pts[pts.length-2];
  const span=Math.abs(last.x-prev.x)||1;
  const off=(asc?(v-last.x):(last.x-v))/span*20;
  return Math.min(120, 100+off);
}
function tierOf(score){
  if(score===null) return null;
  if(score>=99.5) return 4;
  if(score>=80) return 3;
  if(score>=60) return 2;
  if(score>=40) return 1;
  return 0;
}
function tierName(score){
  if(score===null) return '—';
  if(score>100.5) return 'Elite +';
  return TIERS[tierOf(score)].n;
}
function tierColor(score){
  if(score===null) return 'var(--line)';
  return 'var(--'+TIERS[tierOf(score)].k+')';
}

// Sex-adjusted ladder for a race leg or a test
function ladFor(arr, factor){ return arr.map(v=>round(v*factor,4)); }
function raceLad(distKey, leg){
  const r=RACE[distKey]; const f = state.profile.sex==='f' ? (SEXF.time[leg]||SEXF.time.total) : 1;
  return ladFor(r[leg], f);
}
function testLad(id){
  const t=TESTBY[id]; const f = state.profile.sex==='f' ? (SEXF.test[id]||1) : 1;
  return ladFor(t.lad, f);
}

function weekKey(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return 'unknown';
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=(t.getUTCDay()+6)%7;
  t.setUTCDate(t.getUTCDate()-day+3);
  const y=t.getUTCFullYear();
  const jan4=new Date(Date.UTC(y,0,4));
  const wk=1+Math.round(((t-jan4)/86400000-3+((jan4.getUTCDay()+6)%7))/7);
  return y+'-W'+String(wk).padStart(2,'0');
}
function weekStart(key){
  const [y,w]=key.split('-W').map(Number);
  const jan4=new Date(Date.UTC(y,0,4));
  const d=new Date(jan4); d.setUTCDate(jan4.getUTCDate()-((jan4.getUTCDay()+6)%7)+(w-1)*7);
  return d;
}

let saveTimer=null, dirty={};
function markDirty(k){ dirty[k]=true; scheduleSave(); }
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(save,450); }

async function save(){
  const keys=Object.keys(dirty); dirty={};
  try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
  if(!DB) return;
  try{
    if(keys.includes('profile')) await DB.doc('athlete/profile').set(state.profile);
    if(keys.includes('races'))    await DB.doc('logs/races').set({items:state.races});
    if(keys.includes('tests'))    await DB.doc('logs/tests').set({items:state.tests});
    if(keys.includes('wellness')) await DB.doc('logs/wellness').set({items:state.wellness.slice(0,730)});
    for(const k of keys){
      if(k.startsWith('week:')){
        const wk=k.slice(5);
        await DB.doc('weeks/'+wk).set(state.weeks[wk]||{sessions:[]});
      }
    }
  }catch(e){ toast('Could not sync: '+(e&&e.code||'error')); }
}

async function boot(){
  // local first, so the page is never empty while the capability resolves
  try{
    let raw=localStorage.getItem(LS);
    if(!raw){                                  // carry data over from the old key
      const legacy=localStorage.getItem(LS_OLD);
      if(legacy){ localStorage.setItem(LS, legacy); localStorage.removeItem(LS_OLD); raw=legacy; }
    }
    if(raw) state=Object.assign(JSON.parse(JSON.stringify(BLANK)), JSON.parse(raw));
  }catch(e){}
  if(!state.races.length && !state.tests.length && !Object.keys(state.weeks).length) state=sample();
  render();

  if(typeof window.claude==='undefined'||!window.claude.use) { setStore('This browser only'); return; }
  const [db,dl]=await Promise.all([window.claude.use('db'), window.claude.use('downloads')]);
  DL=dl;
  if(!db){ setStore('This browser only'); return; }
  DB=db; storeMode='db'; setStore('Synced · saved to your account');
  try{
    const [p,r,t,w]=await Promise.all([
      DB.doc('athlete/profile').get(), DB.doc('logs/races').get(),
      DB.doc('logs/tests').get(), DB.doc('logs/wellness').get()
    ]);
    const has=p.exists||r.exists||t.exists;
    if(has){
      const fresh=JSON.parse(JSON.stringify(BLANK));
      if(p.exists) fresh.profile=Object.assign(fresh.profile,p.data());
      if(r.exists) fresh.races=(r.data().items)||[];
      if(t.exists) fresh.tests=(t.data().items)||[];
      if(w.exists) fresh.wellness=(w.data().items)||[];
      const ws=await DB.collection('weeks').limit(120).get();
      ws.docs.forEach(d=>{ fresh.weeks[d.id]=d.data(); });
      state=fresh; render(); toast('Loaded your saved data');
    }else if(state.profile.sample===false){
      // push existing local-only data up
      ['profile','races','tests','wellness'].forEach(markDirty);
      Object.keys(state.weeks).forEach(k=>markDirty('week:'+k));
    }
  }catch(e){ setStore('Offline · saved in this browser'); }
}

function latestTest(id){
  const rows=state.tests.filter(t=>t.type===id&&t.value!=null).sort((a,b)=>a.date<b.date?1:-1);
  return rows.length?rows[0]:null;
}
function testScore(id){
  const l=latestTest(id); if(!l) return null;
  return scoreLadder(l.value, testLad(id), TESTBY[id].dir);
}
function bestRace(distKey){
  const rows=state.races.filter(r=>r.distance===distKey);
  if(!rows.length) return null;
  return rows.map(r=>Object.assign({}, r, {total:raceTotal(r)}))
             .sort((a,b)=>a.total-b.total)[0];
}
function latestRace(distKey){
  const rows=state.races.filter(r=>!distKey||r.distance===distKey).sort((a,b)=>a.date<b.date?1:-1);
  return rows.length?rows[0]:null;
}
function raceTotal(r){
  return ['swim','t1','bike','t2','run'].reduce((s,k)=>s+(Number(r[k])||0),0);
}

function weeksSorted(){
  return Object.keys(state.weeks).sort();
}
function weekTotals(key){
  const w=state.weeks[key]; const out={hrs:0,swim:0,bike:0,run:0,swkm:0,bkkm:0,rnkm:0,n:0,longR:0,longRun:0};
  if(!w||!w.sessions) return out;
  w.sessions.forEach(s=>{
    const d=Number(s.dur)||0, k=Number(s.dist)||0;
    out.hrs+=d/60; out.n++;
    if(s.disc==='swim'){ out.swim+=d; out.swkm+=k; }
    if(s.disc==='bike'){ out.bike+=d; out.bkkm+=k; out.longR=Math.max(out.longR,d); }
    if(s.disc==='run'){  out.run+=d;  out.rnkm+=k; out.longRun=Math.max(out.longRun,d); }
  });
  return out;
}
// Recent 4-week average load, used for the Durability pillar
function loadAvg(){
  const ks=weeksSorted().slice(-4);
  if(!ks.length) return null;
  const acc={hrs:0,swkm:0,bkkm:0,rnkm:0,longR:0,longRun:0};
  ks.forEach(k=>{const t=weekTotals(k);
    acc.hrs+=t.hrs; acc.swkm+=t.swkm; acc.bkkm+=t.bkkm; acc.rnkm+=t.rnkm;
    acc.longR=Math.max(acc.longR,t.longR); acc.longRun=Math.max(acc.longRun,t.longRun);});
  ['hrs','swkm','bkkm','rnkm'].forEach(k=>acc[k]=acc[k]/ks.length);
  return acc;
}
function acwr(){
  const ks=weeksSorted(); if(ks.length<2) return null;
  const acute=weekTotals(ks[ks.length-1]).hrs;
  const last4=ks.slice(-4).map(k=>weekTotals(k).hrs);
  const chronic=last4.reduce((a,b)=>a+b,0)/last4.length;
  if(!chronic) return null;
  return acute/chronic;
}

const WEIGHTS={
  sprint: {swim:.25,bike:.20,run:.35,engine:.12,dur:.08},
  olympic:{swim:.25,bike:.20,run:.35,engine:.12,dur:.08},
  half:   {swim:.15,bike:.35,run:.30,engine:.12,dur:.08},
  full:   {swim:.10,bike:.35,run:.30,engine:.13,dur:.12}
};
const WEIGHT_WHY={
  sprint:'Short-course racing is draft-legal: the bike neutralises, so the run decides it.',
  olympic:'Draft-legal WTCS racing is settled on the 10 km — the swim only needs to be good enough to make the front pack.',
  half:'Cycling is the strongest single predictor of finish position among professional 70.3 athletes.',
  full:'Over 180 km the bike sets up everything, and durability — holding form at hour eight — becomes a measured quality.'
};

function pillars(){
  const d=state.profile.distance, W=WEIGHTS[d], r=RACE[d];
  const br=bestRace(d);
  const mix=(parts)=>{ const v=parts.filter(x=>x!==null&&x!==undefined); return v.length?v.reduce((a,b)=>a+b,0)/v.length:null; };

  const swimRace = br?scoreLadder(br.swim, raceLad(d,'swim'), -1):null;
  const bikeRace = br?scoreLadder(br.bike, raceLad(d,'bike'), -1):null;
  const runRace  = br?scoreLadder(br.run,  raceLad(d,'run'),  -1):null;

  const swim   = mix([swimRace, testScore('css'), testScore('sw400')]);
  const bike   = mix([bikeRace, testScore('ftpkg'), testScore('ifhalf')]);
  const run    = mix([runRace, testScore('run5k'), testScore('thrPace'), testScore('brick')]);
  const engine = mix([testScore('vo2'), testScore('ltPct'), testScore('rhr'), testScore('hrv'), testScore('bf')]);

  const la=loadAvg();
  const durParts=[];
  if(la){
    durParts.push(scoreLadder(la.hrs, testLad('hrs'), 1));
    durParts.push(scoreLadder(la.swkm, testLad('swkm'), 1));
    durParts.push(scoreLadder(la.bkkm, testLad('bkkm'), 1));
    durParts.push(scoreLadder(la.rnkm, testLad('rnkm'), 1));
  }
  durParts.push(testScore('sleep'));
  const dur=mix(durParts);

  return [
    {k:'swim',   n:'Swim',       s:swim,   w:W.swim,   c:'var(--swim)'},
    {k:'bike',   n:'Bike',       s:bike,   w:W.bike,   c:'var(--bike)'},
    {k:'run',    n:'Run',        s:run,    w:W.run,    c:'var(--run)'},
    {k:'engine', n:'Engine',     s:engine, w:W.engine, c:'var(--brand)'},
    {k:'dur',    n:'Durability', s:dur,    w:W.dur,    c:'var(--gold)'}
  ];
}
function eliteIndex(){
  const ps=pillars().filter(p=>p.s!==null);
  if(!ps.length) return null;
  const tw=ps.reduce((a,p)=>a+p.w,0);
  return ps.reduce((a,p)=>a+p.s*p.w,0)/tw;
}

/* ---------- 6. SVG COMPONENTS --------------------------------------------- */

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* The gate ladder. The track is the SCORE axis (0–120), so the five tier gates
   sit at the same place on every row and rows can be read against each other.
   Labels live once per card in gateKey(), never repeated per row. */
const GL_MAX=120;
const glPos=s=>Math.max(0,Math.min(1,s/GL_MAX))*100;

function gateLadder(value, lad, dir, opts){
  opts=opts||{};
  const sc = (value!=null&&!isNaN(value)) ? scoreLadder(value,lad,dir) : null;
  let g='';
  for(let i=0;i<4;i++){
    const a=glPos((i+1)*20), b=glPos((i+2)*20);
    g+=`<i class="seg" style="left:${a}%;width:${b-a}%;background:var(--${TIERS[i+1].k});opacity:${0.32+i*0.16}"></i>`;
  }
  TIERS.forEach(t=>{ g+=`<i class="gate" style="left:${glPos(t.s)}%;background:var(--${t.k})"></i>`; });
  if(opts.ref!=null){
    const rs=scoreLadder(opts.ref,lad,dir);
    if(rs!==null) g+=`<i class="ref" style="left:${glPos(rs)}%" title="${esc(opts.refLabel||'Reference performance')}"></i>`;
  }
  if(sc!==null) g+=`<i class="mark" style="left:${glPos(sc)}%;background:${tierColor(sc)}"></i>`;
  const aria=`${opts.aria||'benchmark'}${sc===null?', not measured':', '+tierName(sc)+', score '+Math.round(sc)+' of 100'}`;
  return `<div class="lad" role="img" aria-label="${esc(aria)}">${g}</div>`;
}

// One labelled scale for a whole card of ladders.
function gateKey(note){
  return `<div class="glkey"><div class="glkey-t">
    ${TIERS.map(t=>`<span style="left:${glPos(t.s)}%;color:var(--${t.k})" title="${esc(t.n)}">${esc(t.ab)}</span>`).join('')}
  </div>${note?`<div class="glkey-n">${note}</div>`:''}</div>`;
}

// Line chart with crosshair + tooltip. series = [{name,color,points:[{x,y,label}]}]
function lineChart(el, series, opts){
  opts=opts||{};
  const W=760, H=opts.h||220, m={t:14,r:14,b:26,l:opts.l||42};
  const all=series.flatMap(s=>s.points);
  if(!all.length){ el.innerHTML='<div class="empty">No data yet.</div>'; return; }
  const xs=all.map(p=>p.x), ys=all.map(p=>p.y);
  let y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  if(opts.y0!=null) y0=Math.min(y0,opts.y0);
  if(opts.y1!=null) y1=Math.max(y1,opts.y1);
  const pad=(y1-y0)*0.12||1; y0-=pad; y1+=pad;
  const x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs)||x0+1;
  const X=v=>m.l+((v-x0)/((x1-x0)||1))*(W-m.l-m.r);
  const Y=v=>m.t+(1-(v-y0)/((y1-y0)||1))*(H-m.t-m.b);
  let g='';
  // grid + y labels
  const steps=4;
  for(let i=0;i<=steps;i++){
    const v=y0+(y1-y0)*i/steps, yy=Y(v);
    g+=`<line x1="${m.l}" y1="${yy}" x2="${W-m.r}" y2="${yy}" stroke="var(--line-soft)" stroke-width="1"/>`;
    g+=`<text x="${m.l-7}" y="${yy+3.5}" text-anchor="end" font-size="10" font-family="var(--mono)" fill="var(--muted)">${esc(opts.fy?opts.fy(v):round(v,1))}</text>`;
  }
  // gate bands
  (opts.gates||[]).forEach(gt=>{
    if(gt.v<y0||gt.v>y1) return;
    const yy=Y(gt.v);
    g+=`<line x1="${m.l}" y1="${yy}" x2="${W-m.r}" y2="${yy}" stroke="${gt.c}" stroke-width="1" stroke-dasharray="4 3" opacity=".75"/>`;
    g+=`<text x="${W-m.r}" y="${yy-4}" text-anchor="end" font-size="9.5" font-family="var(--mono)" fill="${gt.c}" letter-spacing=".06">${esc(gt.n.toUpperCase())}</text>`;
  });
  // x labels
  const nlab=Math.min(6,all.length);
  const seen=new Set();
  for(let i=0;i<nlab;i++){
    const v=x0+(x1-x0)*i/((nlab-1)||1);
    const lx=X(v); const t=opts.fx?opts.fx(v):round(v,0);
    if(seen.has(t)) continue; seen.add(t);
    g+=`<text x="${lx}" y="${H-8}" text-anchor="middle" font-size="10" font-family="var(--mono)" fill="var(--muted)">${esc(t)}</text>`;
  }
  series.forEach(s=>{
    const pts=s.points.slice().sort((a,b)=>a.x-b.x);
    const d=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p,i)=>{
      const last=i===pts.length-1;
      g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${last?4.5:3.2}" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
    });
    const lp=pts[pts.length-1];
    if(series.length<=4 && opts.label!==false)
      g+=`<text x="${X(lp.x)}" y="${Y(lp.y)-11}" text-anchor="end" font-size="10.5" font-family="var(--mono)" font-weight="600" fill="var(--ink)">${esc(opts.fy?opts.fy(lp.y):round(lp.y,1))}</text>`;
  });
  el.innerHTML=`<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="tip"></div></div>`;
  // hover
  const box=el.querySelector('.chartbox'), svg=box.querySelector('svg'), tip=box.querySelector('.tip');
  svg.addEventListener('mousemove',ev=>{
    const rc=svg.getBoundingClientRect();
    const vx=(ev.clientX-rc.left)/rc.width*W;
    let best=null;
    series.forEach(s=>s.points.forEach(p=>{
      const dd=Math.abs(X(p.x)-vx); if(!best||dd<best.d) best={d:dd,p:p,s:s};
    }));
    if(!best||best.d>40){ tip.style.opacity=0; return; }
    tip.innerHTML=`<div class="muted" style="font-size:11px">${esc(best.p.label||'')}</div>
      <div><span class="discpill"><i style="background:${best.s.color}"></i>${esc(best.s.name)}</span>
      <span class="tv" style="margin-left:8px">${esc(opts.fy?opts.fy(best.p.y):round(best.p.y,2))}</span></div>`;
    tip.style.opacity=1;
    tip.style.left=Math.min(rc.width-160, Math.max(0,(X(best.p.x)/W)*rc.width-60))+'px';
    tip.style.top=Math.max(0,(Y(best.p.y)/H)*rc.height-52)+'px';
  });
  svg.addEventListener('mouseleave',()=>{tip.style.opacity=0});
}

// Stacked weekly-hours bars
function weekBars(el, keys){
  const W=760,H=210,m={t:14,r:14,b:30,l:40};
  if(!keys.length){ el.innerHTML='<div class="empty">Log some sessions to see weekly load.</div>'; return; }
  const rows=keys.map(k=>({k, t:weekTotals(k)}));
  const max=Math.max(1,...rows.map(r=>r.t.hrs))*1.15;
  const bw=(W-m.l-m.r)/rows.length;
  const Y=v=>m.t+(1-v/max)*(H-m.t-m.b);
  const cols={swim:'var(--swim)',bike:'var(--bike)',run:'var(--run)'};
  let g='';
  for(let i=0;i<=4;i++){
    const v=max*i/4, yy=Y(v);
    g+=`<line x1="${m.l}" y1="${yy}" x2="${W-m.r}" y2="${yy}" stroke="var(--line-soft)"/>`;
    g+=`<text x="${m.l-7}" y="${yy+3.5}" text-anchor="end" font-size="10" font-family="var(--mono)" fill="var(--muted)">${round(v,0)}h</text>`;
  }
  rows.forEach((r,i)=>{
    const x=m.l+i*bw+bw*0.18, w=bw*0.64;
    let acc=0;
    ['swim','bike','run'].forEach(dc=>{
      const h=(r.t[dc]/60);
      if(h<=0) return;
      const yTop=Y(acc+h), yBot=Y(acc);
      const hh=Math.max(0,yBot-yTop-2);
      g+=`<rect x="${x}" y="${yTop}" width="${w}" height="${hh}" fill="${cols[dc]}" rx="2"/>`;
      acc+=h;
    });
    const st=weekStart(r.k);
    if(i%2===0||rows.length<9)
      g+=`<text x="${x+w/2}" y="${H-10}" text-anchor="middle" font-size="9.5" font-family="var(--mono)" fill="var(--muted)">${st.getUTCDate()}/${st.getUTCMonth()+1}</text>`;
    g+=`<text x="${x+w/2}" y="${Y(acc)-5}" text-anchor="middle" font-size="10" font-family="var(--mono)" font-weight="600" fill="var(--ink)">${round(acc,1)}</text>`;
  });
  // elite volume reference
  const eliteH=testLad('hrs')[4];
  if(eliteH<max){
    const yy=Y(eliteH);
    g+=`<line x1="${m.l}" y1="${yy}" x2="${W-m.r}" y2="${yy}" stroke="var(--gold)" stroke-dasharray="4 3" stroke-width="1"/>`;
    g+=`<text x="${W-m.r}" y="${yy-4}" text-anchor="end" font-size="9.5" font-family="var(--mono)" fill="var(--gold)" letter-spacing=".06">ELITE ${eliteH}H</text>`;
  }
  el.innerHTML=`<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly training hours by discipline">${g}</svg></div>`;
}

/* ---------- 7. INPUT HELPERS ---------------------------------------------- */

// A time field whose native unit is decimal minutes, with a live m:ss echo.
function timeField(id, label, sub, val){
  return `<label class="f" for="${id}">${esc(label)}<span class="sub">${esc(sub||'decimal minutes')}</span>
    <input type="text" id="${id}" inputmode="decimal" value="${val==null?'':val}" data-time="1" autocomplete="off">
    <span class="echo" id="${id}_e"></span></label>`;
}
function wireTime(scope){
  (scope||document).querySelectorAll('input[data-time]').forEach(inp=>{
    if(inp._wired) return; inp._wired=true;
    const echo=document.getElementById(inp.id+'_e');
    const upd=()=>{
      if(!echo) return;
      const v=parseMin(inp.value);
      if(!inp.value.trim()){ echo.textContent=''; echo.classList.remove('bad'); return; }
      if(v===null){ echo.textContent='not a time'; echo.classList.add('bad'); return; }
      echo.classList.remove('bad');
      echo.textContent=`${fmtDec(v,2)} min  =  ${fmtMin(v)}`;
    };
    inp.addEventListener('input',upd); upd();
  });
}
function readTime(id){ return parseMin(document.getElementById(id).value); }
function readNum(id){ const v=parseFloat(document.getElementById(id).value); return isNaN(v)?null:v; }

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200);
}

const TABS=[
  {id:'dash',  n:'Dashboard',      grp:'Measure'},
  {id:'race',  n:'Race log',       grp:'Measure'},
  {id:'tests', n:'Benchmark tests',grp:'Measure'},
  {id:'train', n:'Training log',   grp:'Measure'},
  {id:'load',  n:'Load & recovery',grp:'Measure'},
  {id:'athl',  n:'Athlete',        grp:'Reference'},
  {id:'std',   n:'Standards',      grp:'Reference'},
  {id:'proto', n:'Test protocols', grp:'Reference'}
];
let active='dash';

function render(){
  // rail
  const nav=document.getElementById('nav');
  let h='', lastG=null;
  TABS.forEach((t,i)=>{
    if(t.grp!==lastG){ h+=`<div class="navgroup">${esc(t.grp)}</div>`; lastG=t.grp; }
    h+=`<button class="tab" role="tab" aria-selected="${active===t.id}" data-tab="${t.id}" type="button"><span class="tnum">${String(i+1).padStart(2,'0')}</span>${esc(t.n)}</button>`;
  });
  nav.innerHTML=h;
  nav.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab; render(); window.scrollTo(0,0);});

  const ei=eliteIndex();
  document.getElementById('idxNum').innerHTML = ei===null?'—<small>/100</small>':`${Math.round(ei)}<small>/100</small>`;
  document.getElementById('idxTier').innerHTML = ei===null
    ? '<span class="tierbadge">Awaiting data</span>'
    : `<span class="tierbadge"><span class="tierdot" style="background:${tierColor(ei)}"></span>${esc(tierName(ei))}</span>`;

  const main=document.getElementById('main');
  main.innerHTML = ({dash:viewDash,race:viewRace,tests:viewTests,train:viewTrain,
                     load:viewLoad,athl:viewAthlete,std:viewStandards,proto:viewProto})[active]();
  wireTime(main);
  (POST[active]||function(){})();
  main.querySelectorAll('[data-clear]').forEach(b=>b.onclick=clearSample);
}
const POST={};

function clearSample(){
  if(!confirm('Clear the sample athlete and start with an empty log?')) return;
  state=JSON.parse(JSON.stringify(BLANK));
  ['profile','races','tests','wellness'].forEach(markDirty);
  save(); render(); toast('Cleared — the log is yours now');
}
function sampleBanner(){
  if(!state.profile.sample) return '';
  return `<div class="banner"><span><strong>Sample athlete loaded.</strong> Every figure below is made up so you can see how the app reads. Clear it before you log anything real.</span>
    <button class="btn sm" data-clear type="button">Start fresh</button></div>`;
}

/* ---------- 9. VIEWS ------------------------------------------------------ */

function viewDash(){
  const d=state.profile.distance, r=RACE[d], ps=pillars(), ei=eliteIndex();
  const br=bestRace(d), lr=latestRace(d);
  const legs=[
    {k:'swim', n:'Swim', c:'var(--swim)', dist:r.swimM/1000+' km'},
    {k:'bike', n:'Bike', c:'var(--bike)', dist:r.bikeKm+' km'},
    {k:'run',  n:'Run',  c:'var(--run)',  dist:r.runKm+' km'}
  ];

  let gaps='';
  if(br){
    const targets=legs.map(l=>{
      const lad=raceLad(d,l.k), sc=scoreLadder(br[l.k],lad,-1);
      const nextT=Math.min(4,tierOf(sc)+1);
      const gate=lad[nextT];
      return {l, sc, gate, delta: br[l.k]-gate};
    }).sort((a,b)=>b.delta-a.delta);
    const t=targets[0];
    gaps=`<div class="note"><strong>Biggest single gain right now:</strong> your ${t.l.n.toLowerCase()} is
      ${fmtMin(t.delta)} off the ${TIERS[Math.min(4,tierOf(t.sc)+1)].n} gate of ${fmtMin(t.gate)}
      for ${r.name.toLowerCase()}. ${esc(WEIGHT_WHY[d])}</div>`;
  }

  return `${sampleBanner()}
  <div class="page-head"><div>
    <div class="eyebrow">${esc(r.name)} · ${esc(r.legs)} · ${state.profile.sex==='f'?'Female':'Male'} standards</div>
    <h2>Where you sit against elite</h2>
  </div>
  <div class="row">${distanceSwitch()}</div></div>
  <p class="page-sub">Every gate below is a real performance standard, not a percentile of this app's users. The Elite Index weights your five pillars for the distance you are targeting.</p>

  <div class="grid g3" style="margin-bottom:16px">
    ${kpi('Elite Index', ei===null?'—':Math.round(ei), '/100', ei===null?'Log a race or a test to start':tierName(ei)+' band')}
    ${kpi('Best '+r.name.toLowerCase(), br?fmtMin(br.total,'h'):'—','', br?new Date(br.date+'T00:00:00').toLocaleDateString(undefined,{month:'short',year:'numeric'}):'No race logged')}
    ${kpi('Elite gate', fmtMin(raceLad(d,'total')[4],'h'),'', 'Gap: '+(br?fmtMin(br.total-raceLad(d,'total')[4],'h'):'—'))}
  </div>

  <div class="grid g2">
    <div class="card">
      <div class="card-h"><h3>Pillars</h3><span class="hint">weighted for ${esc(r.name.toLowerCase())}</span></div>
      ${ps.map(p=>pillarRow(p)).join('')}
      <hr class="hr">
      <p class="muted" style="font-size:12.5px;margin:0">${esc(WEIGHT_WHY[d])}</p>
    </div>

    <div class="card">
      <div class="card-h"><h3>Race splits vs the gates</h3><span class="hint">best ${esc(r.name.toLowerCase())}</span></div>
      ${br?gateKey('Developing \u00b7 Age-Group \u00b7 Competitive \u00b7 National \u00b7 Elite \u2014 one 0\u2013100 scale, so every row reads against every other.')+[{k:'swim'},{k:'bike'},{k:'run'},{k:'total'}].map(x=>{
        const lad=raceLad(d,x.k);
        const nm=x.k==='total'?'Overall':legs.find(l=>l.k===x.k).n;
        const sub=x.k==='total'?r.legs:legs.find(l=>l.k===x.k).dist;
        const sc=scoreLadder(br[x.k],lad,-1);
        return `<div class="gl">
          <div class="gl-name">${esc(nm)}<span class="u">${esc(sub)}</span></div>
          <div>${gateLadder(br[x.k],lad,-1,{ref:r.ref&&r.ref[x.k]!=null?r.ref[x.k]:null,refLabel:r.ref?r.ref.label:'',aria:nm+' benchmark'})}</div>
          <div class="gl-val">${fmtMin(br[x.k],x.k==='total'?'h':'')}<span class="sc">${esc(tierName(sc))} · ${Math.round(sc)}</span></div>
        </div>`;
      }).join(''):'<div class="empty">No '+esc(r.name.toLowerCase())+' race logged yet. Add one in the Race log tab.</div>'}
      ${r.ref?`<p class="muted" style="font-size:11.5px;margin:12px 0 0"><span style="color:var(--gold)">▲</span> ${esc(r.ref.txt)}</p>`:''}
    </div>
  </div>

  ${gaps?'<div style="margin-top:16px">'+gaps+'</div>':''}

  <div class="grid g2" style="margin-top:16px">
    <div class="card">
      <div class="card-h"><h3>Engine markers</h3><span class="hint">latest test values</span></div>
      ${gateKey()}
      ${['vo2','ftpkg','css','run5k','thrPace','ltPct','rhr','bf'].map(id=>testRow(id)).join('')}
    </div>
    <div class="card">
      <div class="card-h"><h3>Weekly load</h3><span class="hint">last 12 weeks</span></div>
      <div id="dashBars"></div>
      <div class="legend" style="margin-top:10px">
        <span><i style="background:var(--swim)"></i>Swim</span>
        <span><i style="background:var(--bike)"></i>Bike</span>
        <span><i style="background:var(--run)"></i>Run</span>
        <span><i style="background:var(--gold)"></i>Elite reference</span>
      </div>
    </div>
  </div>`;
}
POST.dash=function(){
  const el=document.getElementById('dashBars');
  if(el) weekBars(el, weeksSorted().slice(-12));
  wireDistanceSwitch();
};

function kpi(l,k,unit,d){
  return `<div class="kpi"><div class="l">${esc(l)}</div><div class="k">${esc(k)}${unit?'<small>'+esc(unit)+'</small>':''}</div><div class="d">${esc(d)}</div></div>`;
}
function pillarRow(p){
  const w=Math.round(p.w*100);
  const pct=p.s===null?0:Math.max(0,Math.min(100,p.s));
  return `<div class="pillar">
    <div class="pillar-top">
      <span class="pillar-name" style="color:${p.c}">${esc(p.n)}</span>
      <span><span class="pillar-w">weight ${w}%</span> &nbsp;<span class="pillar-sc">${p.s===null?'—':Math.round(p.s)}</span></span>
    </div>
    <div class="track"><i style="width:${pct}%;background:${p.c}"></i>
      <b style="left:20%"></b><b style="left:40%"></b><b style="left:60%"></b><b style="left:80%"></b></div>
    <div class="muted" style="font-size:11.5px">${p.s===null?'no data':esc(tierName(p.s))}</div>
  </div>`;
}
function testRow(id){
  const t=TESTBY[id], l=latestTest(id), lad=testLad(id);
  const sc=l?scoreLadder(l.value,lad,t.dir):null;
  const fmt=v=>t.unit==='time'?fmtMin(v):round(v,2);
  return `<div class="gl">
    <div class="gl-name">${esc(t.n)}<span class="u">${esc(t.u)}</span></div>
    <div>${gateLadder(l?l.value:null,lad,t.dir,{aria:t.n})}</div>
    <div class="gl-val">${l?fmt(l.value):'—'}<span class="sc">${sc===null?'not tested':tierName(sc)+' · '+Math.round(sc)}</span></div>
  </div>`;
}

  </div>

  ${groups.map(g=>`<div class="card" style="margin-bottom:16px">
    <div class="card-h"><h3>${esc(g)}</h3><span class="hint">latest value vs the five gates</span></div>
    ${gateKey()}
    ${TESTS.filter(t=>t.g===g).map(t=>testRow(t.id)).join('')}
  </div>`).join('')}

  <div class="card">
    <div class="card-h"><h3>Test history</h3><span class="hint">${state.tests.length} results</span></div>
    ${state.tests.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Measure</th><th class="num">Value</th><th class="num">Score</th><th>Band</th><th></th></tr></thead>
      <tbody>${state.tests.slice().sort((a,b)=>a.date<b.date?1:-1).map(r=>{
        const t=TESTBY[r.type]; if(!t) return '';
        const sc=scoreLadder(r.value,testLad(r.type),t.dir);
        return `<tr><td class="mono">${esc(r.date)}</td><td>${esc(t.n)}</td>
          <td class="num">${t.unit==='time'?fmtMin(r.value)+' <span class="muted">('+fmtDec(r.value,2)+')</span>':round(r.value,2)+' <span class="muted">'+esc(t.u)+'</span>'}</td>
          <td class="num">${Math.round(sc)}</td>
          <td><span class="tick" style="color:${tierColor(sc)};border-color:${tierColor(sc)}">${esc(tierName(sc))}</span></td>
          <td><button class="btn ghost sm" data-del-test="${esc(r.id)}" type="button">Delete</button></td></tr>`;
      }).join('')}</tbody></table></div>`:'<div class="empty">Nothing recorded yet.</div>'}
  </div>

  <div class="card" style="margin-top:16px">
    <div class="card-h"><h3>Trend</h3><span class="hint"><select id="t_trend" style="width:auto;display:inline-block;padding:3px 7px;font-size:12.5px">${TESTS.map(t=>`<option value="${t.id}">${esc(t.n)}</option>`).join('')}</select></span></div>
    <div id="testTrend"></div>
  </div>`;
}
POST.tests=function(){
  const sel=document.getElementById('t_type'), val=document.getElementById('t_val'),
        echo=document.getElementById('t_echo'), unit=document.getElementById('t_unit'),
        how=document.getElementById('t_how'), hint=document.getElementById('t_hint');
  const syncMeta=()=>{
    const t=TESTBY[sel.value];
    unit.textContent=t.unit==='time'?'decimal minutes':t.u;
    how.textContent=t.how;
    const lad=testLad(sel.value);
    const f=v=>t.unit==='time'?fmtMin(v):round(v,2);
    hint.textContent='Gates  '+lad.map((v,i)=>TIERS[i].ab+' '+f(v)).join('   ·   ');
    updEcho();
  };
  const updEcho=()=>{
    const t=TESTBY[sel.value];
    if(!val.value.trim()){ echo.textContent=''; return; }
    const v=t.unit==='time'?parseMin(val.value):parseFloat(val.value.replace(',','.'));
    if(v===null||isNaN(v)){ echo.textContent='not a number'; echo.classList.add('bad'); return; }
    echo.classList.remove('bad');
    const sc=scoreLadder(v,testLad(sel.value),t.dir);
    echo.textContent=(t.unit==='time'?fmtDec(v,2)+' min = '+fmtMin(v):round(v,2)+' '+t.u)+'  →  '+tierName(sc)+' ('+Math.round(sc)+')';
  };
  sel.onchange=syncMeta; val.addEventListener('input',updEcho); syncMeta();
  document.getElementById('t_add').onclick=()=>{
    const t=TESTBY[sel.value];
    const v=t.unit==='time'?parseMin(val.value):parseFloat(String(val.value).replace(',','.'));
    if(v===null||isNaN(v)){ toast('Enter a value first'); return; }
    state.tests.push({id:uid(), date:document.getElementById('t_date').value, type:sel.value, value:v});
    state.profile.sample=false; markDirty('tests'); markDirty('profile'); render(); toast(t.n+' recorded');
  };
  document.querySelectorAll('[data-del-test]').forEach(b=>b.onclick=()=>{
    state.tests=state.tests.filter(r=>r.id!==b.dataset.delTest); markDirty('tests'); render();
  });
  const tr=document.getElementById('t_trend'), el=document.getElementById('testTrend');
  const drawTrend=()=>{
    const id=tr.value, t=TESTBY[id], lad=testLad(id);
    const rows=state.tests.filter(x=>x.type===id).sort((a,b)=>a.date<b.date?1:-1);
    lineChart(el,[{name:t.n,color:'var(--brand)',points:rows.map(r=>({x:new Date(r.date+'T00:00:00').getTime(),y:r.value,label:r.date}))}],
      {fy:v=>t.unit==='time'?fmtMin(v):round(v,2),
       fx:v=>new Date(v).toLocaleDateString(undefined,{month:'short',year:'2-digit'}),
       gates:[2,3,4].map(i=>({v:lad[i],n:TIERS[i].n,c:'var(--'+TIERS[i].k+')'})),
       y0:Math.min(lad[2],lad[3]), y1:Math.max(lad[2],lad[3])});
  };
  const firstWithData=TESTS.find(t=>state.tests.some(x=>x.type===t.id));
  if(firstWithData) tr.value=firstWithData.id;
  tr.onchange=drawTrend; drawTrend();
};

POST.train=function(){
  document.getElementById('s_add').onclick=()=>{
    const dur=readTime('s_dur');
    if(dur===null){ toast('Duration is needed'); return; }
    const date=document.getElementById('s_date').value;
    const k=weekKey(date);
    if(!state.weeks[k]) state.weeks[k]={sessions:[]};
    state.weeks[k].sessions.push({id:uid(), date, disc:document.getElementById('s_disc').value,
      dur, dist:parseFloat(String(document.getElementById('s_dist').value).replace(',','.'))||0,
      rpe:parseInt(document.getElementById('s_rpe').value)||null,
      hr:parseInt(document.getElementById('s_hr').value)||null});

    markDirty('week:'+k); render();
  });
};

      rhr:parseInt(document.getElementById('w_rhr').value)||null,

      soreness:parseInt(document.getElementById('w_sore').value)||null});
    state.profile.sample=false; markDirty('wellness'); markDirty('profile'); render(); toast('Logged');
  };
  const wc=document.getElementById('wellChart');
  if(wc){
    const w=state.wellness.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,60).reverse();
    lineChart(wc,[
      {name:'HRV',color:'var(--brand)',points:w.filter(x=>x.hrv).map(x=>({x:new Date(x.date+'T00:00:00').getTime(),y:x.hrv,label:x.date}))},
      {name:'Resting HR',color:'var(--run)',points:w.filter(x=>x.rhr).map(x=>({x:new Date(x.date+'T00:00:00').getTime(),y:x.rhr,label:x.date}))}
    ],{fy:v=>round(v,0), fx:v=>new Date(v).toLocaleDateString(undefined,{day:'numeric',month:'short'}), h:200});
  }
};

    <div class="row">
      <button class="btn" id="a_json" type="button">Download JSON backup</button>

function daysTo(ds){
  const n=Math.ceil((new Date(ds+'T00:00:00')-new Date())/86400000);
  if(isNaN(n)) return '';
  if(n<0) return 'That race has been and gone.';
  return `${n} days out — ${Math.floor(n/7)} full weeks of training left.`;
}

const HOSTED = typeof window.claude!=='undefined' && !!window.claude.use;
async function download(filename, data, mime){
  if(DL){
    try{ await DL.save({filename, data}); toast('Saved'); return; }catch(e){ if(e&&e.code!=='cancelled') toast('Download declined'); return; }
  }
  if(HOSTED){ toast('Saving files is not available in this view. Your data is stored and safe.'); return; }
  try{
    const url=URL.createObjectURL(new Blob([data],{type:mime||'text/plain'}));
    const a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500); toast('Downloaded '+filename);
  }catch(e){ toast('Could not save the file'); }
}

    <div class="card-h"><h3>What the five bands mean</h3></div>

      <span class="mono muted" style="font-size:12px">score ${t.s}</span></div>`).join('')}
  </div>

  ${rk.map(k=>{
    const r=RACE[k];
    const legs=[['total','Overall',r.legs],['swim','Swim',r.swimM+' m'],['t1','T1','transition'],['bike','Bike',r.bikeKm+' km'],['t2','T2','transition'],['run','Run',r.runKm+' km']];
    return `<div class="card" style="margin-bottom:16px">
      <div class="card-h"><h3>${esc(r.name)}</h3><span class="hint mono">${esc(r.legs)}</span></div>
      <div class="tablewrap"><table>
        <thead><tr><th>Leg</th>${TIERS.map(t=>`<th class="num" style="color:var(--${t.k})">${esc(t.n)}</th>`).join('')}<th class="num">Pace at Elite</th></tr></thead>
        <tbody>${legs.map(([lk,ln,ld])=>{
          const lad=raceLad(k,lk);
          let pace='—';

          if(lk==='bike') pace=round(r.bikeKm/(lad[4]/60),1)+' km/h';
          if(lk==='run')  pace=fmtMin(lad[4]/r.runKm)+' /km';
          return `<tr><td><strong>${esc(ln)}</strong><br><span class="muted" style="font-size:11.5px">${esc(ld)}</span></td>
            ${lad.map(v=>`<td class="num">${f(v,lk==='total')}<br><span class="muted" style="font-size:11px">${fmtDec(v,1)}</span></td>`).join('')}
            <td class="num">${pace}</td></tr>`;
        }).join('')}</tbody></table></div>
      <p class="muted" style="font-size:12.5px;margin:12px 0 0">${esc(r.note)}</p>
      ${r.ref?`<p style="font-size:12.5px;margin:6px 0 0"><span style="color:var(--gold)">▲</span> <strong>${esc(r.ref.label)}:</strong> ${esc(r.ref.txt)}</p>`:''}
    </div>`;
  }).join('')}

  ${['Swim','Bike','Run','Engine','Load'].map(g=>`<div class="card" style="margin-bottom:16px">
    <div class="card-h"><h3>${esc(g)} measures</h3><span class="hint">${esc(g==='Load'?'sustained weekly averages, not peak weeks':'lower or higher is better as marked')}</span></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Measure</th><th>Unit</th><th></th>${TIERS.map(t=>`<th class="num" style="color:var(--${t.k})">${esc(t.n)}</th>`).join('')}</tr></thead>
      <tbody>${TESTS.filter(t=>t.g===g).map(t=>{
        const lad=testLad(t.id);
        return `<tr><td><strong>${esc(t.n)}</strong></td><td class="muted">${esc(t.u)}</td>
          <td class="muted mono" style="font-size:11px">${t.dir===1?'higher ↑':'lower ↓'}</td>
          ${lad.map(v=>`<td class="num">${t.unit==='time'?fmtMin(v):round(v,2)}</td>`).join('')}</tr>`;
      }).join('')}</tbody></table></div>
  </div>`).join('')}

  <div class="card">
    <div class="card-h"><h3>Where these numbers come from</h3></div>
    <p style="font-size:13.5px;margin-top:0">Race gates are calibrated so the Elite gate sits on a genuine championship performance rather than a round number:</p>
    <ul style="font-size:13.5px;line-height:1.65;padding-left:20px;margin:0">
      <li><strong>Olympic</strong> — Matt Hauser, 1:42:42 (17:49 / 54:31 / 29:16), WTCS Grand Final Wollongong 2025.</li>
      <li><strong>70.3</strong> — Jelle Geens, 3:42:52 (23:19 / 2:09:38 / 1:07:35), 70.3 World Championship Marbella 2025.</li>
      <li><strong>Ironman</strong> — Kristian Blummenfelt, 7:21:12 (39:41 / 4:02:40 / 2:35:24), Cozumel 2021; Kona course record 7:35:53, Patrick Lange 2024.</li>
      <li><strong>National gate, Ironman</strong> — the observed Kona-qualifying band for men 30–44, roughly 8:50 to 9:40 depending on course and race.</li>
      <li><strong>Age-group and mid-field gates</strong> — published average and "good" finish times across each distance.</li>
      <li><strong>Physiology</strong> — VO₂max ranges reported for elite endurance sport, standard FTP-per-kilogram category tables, and the CSS and threshold-pace equivalents of the race gates above.</li>
    </ul>
    <p class="muted" style="font-size:12.5px;margin-bottom:0">Courses vary enormously — a windy, hilly, non-wetsuit race can cost twenty minutes over 70.3. Read a single race against these gates loosely, and a season of them closely.</p>
  </div>`;
}

/* ----- Protocols ----- */
function viewProto(){
  const groups=['Swim','Bike','Run','Engine','Load'];
  return `<div class="page-head"><div><div class="eyebrow">Reference</div><h2>Test protocols</h2></div></div>
  <p class="page-sub">A benchmark is only worth logging if it is repeatable. Run each of these the same way every time — same course, same time of day, same warm-up, similar rest — so the number moves for real reasons.</p>

  <div class="card" style="margin-bottom:16px">
    <div class="card-h"><h3>A testing rhythm that works</h3></div>
    <ol style="font-size:13.5px;line-height:1.7;padding-left:20px;margin:0">
      <li><strong>Every 6–8 weeks</strong> — 400 m swim time trial, 20-minute bike test, 5 km run time trial. Spread across a single easy week, one per day, never stacked.</li>
      <li><strong>Every 10–12 weeks</strong> — CSS re-set (400 m + 200 m), brick decay test, threshold run pace.</li>
      <li><strong>Twice a year</strong> — lab work if you have access: VO₂max, lactate threshold, running economy, body composition.</li>
      <li><strong>Daily</strong> — morning HRV, resting heart rate, sleep, body mass. These cost thirty seconds and catch problems weeks before a test does.</li>
      <li><strong>Every session</strong> — duration, distance, RPE. The load record is what makes every other number interpretable.</li>
    </ol>
  </div>

  ${groups.map(g=>`<div class="card" style="margin-bottom:16px">
    <div class="card-h"><h3>${esc(g)}</h3></div>
    ${TESTS.filter(t=>t.g===g).map(t=>{
      const lad=testLad(t.id);
      const fv=v=>t.unit==='time'?fmtMin(v):round(v,2);
      return `<div style="padding:11px 0;border-bottom:1px solid var(--line-soft)">
        <div class="row" style="justify-content:space-between;gap:10px">
          <strong style="font-size:14.5px">${esc(t.n)}</strong>
          <span class="mono muted" style="font-size:11.5px">Elite gate ${fv(lad[4])} ${esc(t.u)}</span>
        </div>
        <p style="font-size:13px;color:var(--ink-2);margin:5px 0 0">${esc(t.how)}</p>
      </div>`;
    }).join('')}
  </div>`).join('')}`;
}
